<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TraceForge — 3D PCB Designer</title>
<style>
:root{--bg1:#e9eef5;--bg2:#cfd8e6;--panel:rgba(255,255,255,.85);--ink:#1b2430;--mut:#5d6b7c;--acc:#0a9d6b;--line:#c5cedb;--btn:#f4f7fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1a2230;--bg2:#0b0f16;--panel:rgba(22,28,38,.85);--ink:#e6edf3;--mut:#8b98a9;--acc:#3ddc97;--line:#2d3746;--btn:#202938}}
:root[data-theme="dark"]{--bg1:#1a2230;--bg2:#0b0f16;--panel:rgba(22,28,38,.85);--ink:#e6edf3;--mut:#8b98a9;--acc:#3ddc97;--line:#2d3746;--btn:#202938}
html,body{height:100%;margin:0}
body{font:14px system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2));overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;grid-template-columns:236px 1fr}
header{grid-column:1/3;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
header b{letter-spacing:.6px;margin-right:auto;display:flex;align-items:center;gap:8px}header b::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--acc)}
button{font:inherit;color:var(--ink);background:var(--btn);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
kbd{font-size:11px;opacity:.6;margin-left:4px}
#pal{overflow:auto;padding:8px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--btn);cursor:grab;touch-action:none;user-select:none;white-space:nowrap}
.it:hover{border-color:var(--acc)}
.sw{width:14px;height:14px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
#pal details{border:1px solid var(--line);border-radius:10px;background:var(--btn);flex:none}
#pal summary{cursor:pointer;padding:9px 10px;font-weight:600;font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);list-style:none;display:flex;justify-content:space-between}
#pal summary::-webkit-details-marker{display:none}
#pal summary::after{content:"+"}
#pal details[open] summary::after{content:"\2212"}
#pal .cb{display:flex;flex-direction:column;gap:2px;padding:2px 6px 8px}
#pal .it{border:0;background:transparent;padding:6px 8px}
#pal .it:hover{background:var(--panel)}
button:hover{border-color:var(--acc)}
#tip{position:absolute;z-index:3;pointer-events:none;display:none;padding:6px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;backdrop-filter:blur(8px);line-height:1.4}
#tip b{display:block}#tip span{color:var(--mut)}
header b{margin-right:12px}
.grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}.grp:last-child{border:0;padding:0}
#insp{position:absolute;right:10px;bottom:10px;z-index:2;display:none;max-width:250px;max-height:40%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px)}
#stat{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;font:12px ui-monospace,monospace;color:var(--mut);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;white-space:nowrap}
.mu{color:var(--mut)}.pn{display:inline-block;margin:2px;padding:1px 6px;border:1px solid var(--line);border-radius:6px;font-size:11px}.pn i{color:var(--acc);font-style:normal}
#view{position:relative;min-width:0;min-height:0;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint,#toast{position:absolute;left:10px;padding:6px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--mut);z-index:2;max-width:calc(100% - 20px)}
#hint{bottom:10px}
#toast{top:10px;color:var(--ink);opacity:0;transition:opacity .25s;pointer-events:none}
#drc{position:absolute;right:10px;top:10px;z-index:2;max-width:260px;max-height:50%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:none}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9}
#mod.on{display:flex}
.box{background:var(--bg1);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(640px,92vw);display:flex;flex-direction:column;gap:8px}
textarea{height:46vh;font:12px ui-monospace,monospace;background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
select{font:inherit;padding:6px;border-radius:8px;background:var(--btn);color:var(--ink);border:1px solid var(--line)}
@media(max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr 76px}#pal{grid-row:3;flex-direction:row;border-right:0;border-top:1px solid var(--line)}.it{flex:0 0 auto}}
</style></head><body>
<div id="app">
<header><b>TraceForge</b>
<button id="bWire">Wire<kbd>W</kbd></button><button id="bRot">Rotate<kbd>R</kbd></button><button id="bDel">Delete<kbd>Del</kbd></button><button id="bUndo">Undo<kbd>Ctrl+Z</kbd></button><button id="bTop">Top view<kbd>T</kbd></button><button id="bLay">Layer: Top<kbd>L</kbd></button><button id="bChk">Check</button><button id="bNet">Nets</button><button id="bLink">Link power</button><button id="bPour">Pour GND</button><select id="tw" title="Trace width (mm)"><option>0.25</option><option selected>0.5</option><option>1</option><option>1.5</option></select><button id="bExp">Export Gerber</button></header>

<main id="view"><div id="toast"></div><div id="drc"></div><div id="tip"></div><div id="insp"></div><div id="stat"></div><div id="hint"></div></main>
</div>
<div id="mod"><div class="box"><select id="fs"></select><textarea id="ft" readonly></textarea><div style="display:flex;gap:6px"><button id="fc">Copy</button><button id="fd">Download</button><button id="fx">Close</button></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{

pins:ks.map(i=>[0,i]).concat(ks.map(i=>[3,h-1-i])),build:a=>{const L=(h-1)*G;

a(new T.CylinderGeometry(2.3,2.3,4.6,24,1,false,0,Math.PI).rotateY(-Math.PI/2),M(0x1b1b1f,{roughness:.5}),G,3.7,0)}},
{id:'dio',name:'Diode 1N4148',sw:'#d9a05a',pins:[[0,0],[3,0]],build:a=>{legs(a,[[0,0],[3,0]],1.3);
a(rz(cy(.25,3*G,8)),metal(),1.5*G,1.3,0);a(rz(cy(1,3.8)),M(0xe0a85c,{opacity:.9}),1.5*G,1.3,0);a(rz(cy(1.05,.6)),M(0x111111),1.5*G+1.3,1.3,0)}},
{id:'btn',name:'Push button',sw:'#2f6fed',pins:[[0,0],[2,0],[0,2],[2,2]],build:a=>{legs(a,[[0,0],[2,0],[0,2],[2,2]],1);
a(bx(6.2,3.4,6.2),M(0x24282f),G,1.7,G);a(cy(1.8,2,24),M(0x2f6fed,{roughness:.3}),G,4.3,G)}},

a(bx(4*G,2.5,G),M(0x14161a),1.5*G,1.25,0);[0,1,2,3].forEach(i=>a(bx(.64,11,.64),gold(),i*G,3.9,0))}},
{id:'pot',name:'Potentiometer',sw:'#1c5fb0',pins:[[0,0],[1,0],[2,0]],build:a=>{legs(a,[[0,0],[1,0],[2,0]],1);
a(bx(9.5,5.5,9),M(0x1c5fb0,{roughness:.4}),G,2.75,-3.2);a(cy(2.4,4,28),gold(),G,7.5,-3.2);a(bx(3.6,.5,.7),M(0x222222),G,9.6,-3.2)}},

{id:'seg',name:'7-segment display',sw:'#ff2a2a',pins:[0,1,2,3,4].map(i=>[i,0]).concat([0,1,2,3,4].map(i=>[i,6])),build:a=>{legs(a,[0,1,2,3,4].map(i=>[i,0]).concat([0,1,2,3,4].map(i=>[i,6])),1);a(bx(13,7,19),M(0x15171c),2*G,4.5,3*G);const r=M(0xff2a2a,{emissive:0xff2a2a,emissiveIntensity:.8}),cz=3*G;[-6.5,0,6.5].forEach(z=>a(bx(5,.2,1.1),r,2*G,8.1,cz+z));[[-3.2,-3.3],[3.2,-3.3],[-3.2,3.3],[3.2,3.3]].forEach(([x,z])=>a(bx(1.1,.2,5.4),r,2*G+x,8.1,cz+z))}},

function solveLin(A,B){const n=B.length;for(let i=0;i<n;i++){let p=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;[A[i],A[p]]=[A[p],A[i]];[B[i],B[p]]=[B[p],B[i]];const d=A[i][i]||1e-18;for(let r=i+1;r<n;r++){const f=A[r][i]/d;if(!f)continue;for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];B[r]-=f*B[i]}}const x=Array(n).fill(0);for(let i=n-1;i>=0;i--){let s=B[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/(A[i][i]||1e-18)}return x}

const ICM={};
const icm=(id,o)=>{ICM[id]=o};
const opamp=(o,ip,im,vp,vm)=>(c,P,S)=>{
  const hi=P(vp),lo=P(vm);
  if(hi-lo<.5){S.src(S.n(o),S.n(vm),0,.5);return}
  let v=1e5*(P(ip)-P(im));
  v=Math.max(lo,Math.min(hi,v));
  S.src(S.n(o),S.n(vm),v-lo,.5);
};
const bjt=(b,e,cc)=>(c,P,S)=>{

  if(want){S.src(S.n(b),S.n(e),.7,.02);S.g(S.n(cc),S.n(e),5)}
  else{S.g(S.n(b),S.n(e),1e-9);S.g(S.n(cc),S.n(e),1e-9)}
};

icm('dip1674HC595',{
  f:(c,P,S)=>{const st=c.st||(c.st={sr:0,out:0,srclk:0,rclk:0});const g=P(7),v=P(15)-g;

    S.g(S.n(8),S.n(7),1e-9);S.g(S.n(9),S.n(7),1e-9);S.g(S.n(10),S.n(7),1e-9);S.g(S.n(11),S.n(7),1e-9);S.g(S.n(13),S.n(7),1e-9)},
  s:(c,P)=>{const st=c.st||(c.st={sr:0,out:0,srclk:0,rclk:0});const g=P(7),v=P(15)-g;

const DIODE={};['ledR','ledG','ledB','ledY','ledW','smdL','dio','d4007','d5819','dz51'].forEach(k=>DIODE[k]=1);

const SUB=8,DT=0.0125;
function solveOnce(dt){
  const L=nets(),nodeOf={};let nn=0;
  L.forEach(n=>{n.pins.forEach(([c,p])=>nodeOf[key(...comps[c].pins[p])]=nn);nn++});
  comps.forEach(c=>c.pins.forEach(p=>{const k=key(...p);if(nodeOf[k]===undefined)nodeOf[k]=nn++}));
  const nd=(c,i)=>nodeOf[key(...c.pins[i])];
  const gs=new Set();comps.forEach(c=>{if(c.d.flag==='GND')gs.add(nd(c,0))});
  const bt=comps.find(c=>c.d.id==='bat');if(!gs.size&&bt)gs.add(nd(bt,1));
  if(!gs.size)return null;
  const imap={};let N=0;for(let n=0;n<nn;n++)if(!gs.has(n))imap[n]=N++;
  let X=(lastX.length===N)?lastX.slice():Array(N).fill(0);
  const raw=n=>n<0?0:(gs.has(n)?0:(X[imap[n]]||0));
  comps.forEach(c=>{const m=ICM[c.d.id];if(m&&m.s){try{m.s(c,i=>raw(nd(c,i)))}catch(e){}}});
  const gi=n=>(n<0||gs.has(n))?-1:imap[n];
  let it=0,force=true;
  for(;;){
    let changed=false;
    const A=[...Array(N)].map(()=>Array(N).fill(0)),B=Array(N).fill(0);
    for(let i=0;i<N;i++)A[i][i]+=1e-9;
    const g=(a,b,G)=>{if(!(G>0)||a===b)return;const i=gi(a),j=gi(b);if(i>=0)A[i][i]+=G;if(j>=0)A[j][j]+=G;if(i>=0&&j>=0){A[i][j]-=G;A[j][i]-=G}};
    const src=(a,b,v,G)=>{g(a,b,G);const i=gi(a),j=gi(b);if(i>=0)B[i]+=G*v;if(j>=0)B[j]-=G*v};
    const cur=(a,b,I)=>{const i=gi(a),j=gi(b);if(i>=0)B[i]-=I;if(j>=0)B[j]+=I};
    for(const c of comps){
      const id=c.d.id,P=i=>raw(nd(c,i)),n=i=>nd(c,i);
      const S={g,src,cur,n,flag:()=>{changed=true}};
      if(CAPV[id]!==undefined){const C=c.val||CAPV[id];src(n(0),n(1),c.cv||0,C/dt);continue}
      if(id==='res'||id==='smdR'||id==='smd0805R'){g(n(0),n(1),1/Math.max(c.val||330,.01));continue}
      if(id==='pot'){const R=Math.max(c.val||10000,.01);g(n(0),n(1),2/R);g(n(1),n(2),2/R);continue}
      if(id==='bat'){src(n(0),n(1),c.val||9,20);continue}
      if(id==='vcc'){src(n(0),-1,c.val||5,20);continue}
      if(id==='gnd')continue;
      if(id==='btn'){g(n(0),n(2),1e3);g(n(1),n(3),1e3);if(c.on)g(n(0),n(1),1e3);continue}
      if(id==='sw'){g(n(1),n(c.on?2:0),1e3);continue}
      if(id==='buz'){g(n(0),n(1),120);continue}
      if(id==='relay'){g(n(0),n(1),70);const on=Math.abs(P(0)-P(1))>3;g(n(3),n(on?2:4),on?1e3:1e-9);continue}
      if(DIODE[id]){const vf=c.val||0.7,st=c.st||(c.st={});
        const want=(P(0)-P(1))>vf;
        if(want!==!!st.on){st.on=want;changed=true}
        if(want)src(n(0),n(1),vf,.1);else g(n(0),n(1),1e-9);
        continue}
      const m=ICM[id];
      if(m){try{m.f(c,P,S)}catch(e){}continue}
    }
    X=solveLin(A,B);
    if(!changed&&!force)break;
    force=false;
    if(++it>60)break;
  }
  comps.forEach(c=>{if(CAPV[c.d.id]!==undefined)c.cv=raw(nd(c,0))-raw(nd(c,1))});
  lastX=X;
  return{P:(c,i)=>raw(nd(c,i)),gs,nd};
}
function paintSim(ctx){
  clearGlow();
  if(!ctx){sp.innerHTML='<b>Simulation</b><a id="sx" style="float:right;cursor:pointer">\u2715</a><div class="mu" style="margin-top:6px">Add a GND flag (or a battery) so the simulator knows where 0 V is.</div>';return}
  const P=ctx.P,rows=netRows(),warn=[],out=[];
  comps.forEach(c=>{
    const id=c.d.id;
    if(id==='bat'||id==='vcc'){
      const v=c.val||(id==='bat'?9:5),a=P(c,0),b=id==='bat'?P(c,1):0,I=20*(v-(a-b));
      out.push('<div>'+c.ref+': '+v+' V \u00b7 '+fI(Math.abs(I))+'</div>');
      if(Math.abs(I)>2)warn.push(c.ref+': short circuit! Something joins + straight to ground.');
    }else if(id==='res'||id==='smdR'||id==='smd0805R'){
      const R=Math.max(c.val||330,.01),I=(P(c,0)-P(c,1))/R,Pw=I*I*R;
      if(Math.abs(I)>1e-6)out.push('<div>'+c.ref+' '+fR(R)+': '+fI(Math.abs(I))+'</div>');
      if(Pw>.25)warn.push(c.ref+' gets hot ('+Pw.toFixed(2)+' W). Use a bigger resistance.');
    }else if(/^led/.test(id)||id==='smdL'){
      const vf=c.val||2,on=(P(c,0)-P(c,1))>vf*.95,I=on?Math.max(0,(P(c,0)-P(c,1)-vf)*.1):0;
      out.push('<div>'+c.ref+': '+(on?fI(I)+' (lit)':'off')+'</div>');
      glow(c,Math.min(1,I/.015));
      if(I>.1)warn.push(c.ref+' would burn out ('+fI(I)+'). Add a resistor in series.');
      else if(I>.03)warn.push(c.ref+' gets too much current ('+fI(I)+'). Use a bigger resistor.');
    }else if(id==='buz'){
      const I=Math.abs((P(c,0)-P(c,1))/120);
      if(I>1e-4)out.push('<div>'+c.ref+': buzzing ('+fI(I)+')</div>');
    }else if(ICM[id]&&ICM[id].rep){
      out.push('<div>'+c.ref+' '+esc(c.d.name.split(' \u00b7 ')[0])+': '+ICM[id].rep(c,P)+'</div>');
    }
  });
  const netV=rows.map(r=>{const k=r.n.pins[0];if(!k)return null;const c=comps[k[0]];return c?P(c,k[1]):null});
  let h='<b>Simulation</b> <span class="mu">t='+simTime.toFixed(1)+' s</span><a id="sx" style="float:right;cursor:pointer">\u2715</a>';
  if(warn.length)h+=warn.map(w=>'<div style="color:#e5484d;margin-top:4px">\u26a0 '+esc(w)+'</div>').join('');
  h+='<div style="margin-top:6px"><b>Nets</b></div>'+rows.map((r,i)=>'<div>'+esc(r.name)+': '+(netV[i]==null?'\u2014':netV[i].toFixed(2)+' V')+'</div>').join('');
  h+='<div style="margin-top:6px"><b>Parts</b></div>'+(out.join('')||'<div class="mu">Nothing to report yet.</div>');
  sp.innerHTML=h;
}
function simReset(){comps.forEach(c=>{c.cv=0;c.st=null});lastX=[];simTime=0}
function simStep(){if(!simOn)return;let ctx=null;for(let k=0;k<SUB;k++)ctx=solveOnce(DT);paintSim(ctx)}
function toggleSim(){simOn=!simOn;$('#bSim').classList.toggle('on',simOn);
  if(simOn){simReset();sp.style.display='block';simStep()}
  else{sp.style.display='none';clearGlow()}}

 const wireCells=refreshWireCells(),blocked=new Set(blockedPads);wireCells.forEach(k=>{if(!sameCells.has(k))blocked.add(k)});const allowedNow=new Set([...allowed,...sameCells]);const path=routeGrid(anchor.pos,target.pos,blocked,allowedNow);if(!path){failed.push(group.name+': '+anchor.ref+'.'+anchor.pin+' → '+target.ref+'.'+target.pin);return}
 const w=addWire(path,'F',+$('#tw').value);undo.push({t:'w',w});path.forEach(p=>sameCells.add(p.join(',')));routed++});
 });
 const message='Autorouter added '+routed+' route(s)'+(already?', '+already+' already connected':'')+(failed.length?'; failed: '+failed.join('; '):'')+'. Run Check and inspect every trace before fabrication.';
 $('#siNetWarnings').textContent=message;toast(message);if(routed){showNets()}
}

$('#siOCR').onclick=async()=>{if(!imageUrl)return;const b=$('#siOCR');b.disabled=true;$('#siStatus').textContent='Loading OCR engine…';try{if(!window.Tesseract){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=resolve;s.onerror=()=>reject(new Error('Could not load OCR engine. Check your internet connection.'));document.head.appendChild(s)})}$('#siStatus').textContent='Reading text from drawing…';const result=await Tesseract.recognize(imageUrl,'eng',{logger:m=>{if(m.status)$('#siStatus').textContent=m.status+(m.progress?' · '+Math.round(m.progress*100)+'%':'')}});const text=result.data.text||((result.data.words||[]).map(w=>w.text).join(' '));$('#siOCRText').textContent=text||'No readable text found. Add components manually.';rows=parseDetected(text);drawRows();$('#siStatus').textContent=rows.length?'OCR finished: found '+rows.length+' component reference(s). Review the part types, then click Place components on PCB.':'OCR finished, but no component reference labels were recognised. This importer reads printed labels; it does not recognise symbol shapes. Add missing parts manually.'}catch(err){$('#siStatus').textContent=err.message||'OCR failed'}b.disabled=false};
function nextSpot(d){for(let z=3;z<NZ-3;z+=2)for(let x=3;x<NX-3;x+=2)if(valid(d,x,z,0))return[x,z];return null}
function importParts(keepOpen=false){
 if(!rows.length){$('#siStatus').textContent='No component references to place. Run OCR or add parts manually.';return}
 let placed=0,reused=0,skipped=[];const seen=new Set();
 rows.forEach(r=>{
  const ref=String(r.ref||'').trim().toUpperCase(),d=BD(r.id);
  if(!ref){skipped.push('(empty reference)');return}
  if(seen.has(ref)){skipped.push(ref+' (duplicate row)');return}seen.add(ref);
  if(!d){skipped.push(ref+' (unsupported part type)');return}
  const existing=comps.find(q=>q.ref.toUpperCase()===ref);
  if(existing){
   if(existing.d.id!==r.id){skipped.push(ref+' (already used by '+existing.d.name+')');return}
   const v=parseSIValue(r.value,d.id);if(v!==undefined){existing.val=v;if(d.id==='res')bands(existing.g,v)}
   reused++;return
  }
  const p=nextSpot(d);if(!p){skipped.push(ref+' (no free board position)');return}
  const c=addComp(d,p[0],p[1],0,mk(d)),v=parseSIValue(r.value,d.id);
  if(c.ref!==ref){const oldTag=c.g.children.find(q=>q.userData.tag);if(oldTag)c.g.remove(oldTag);c.ref=ref;c.g.add(tag(ref))}
  if(v!==undefined){c.val=v;if(d.id==='res')bands(c.g,v)}
  undo.push({t:'p',c});placed++
 });
 if(placed||reused){fit();const msg='Placed '+placed+' new component(s); reused '+reused+' matching component(s) already on the board.';$('#siStatus').textContent=msg;toast(msg)}
 if(skipped.length){const msg='Skipped '+skipped.length+': '+skipped.slice(0,8).join(', ')+(skipped.length>8?'…':'');$('#siStatus').textContent=msg;toast(msg)}
 if(!placed&&!reused&&!skipped.length)$('#siStatus').textContent='No components were placed.';
 if(!keepOpen)closeSI()
}
$('#siPlace').onclick=importParts;
})();
